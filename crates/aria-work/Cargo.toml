[package]
name = "aria-work"
description = "Workspace alias for the work gateway binary (published as aria-json-telemetry --bin work)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository = "https://github.com/5of5/json-telemetry"
homepage = "https://github.com/5of5/json-telemetry"
documentation = "https://docs.rs/aria-json-telemetry"
readme = "README.md"
rust-version.workspace = true
publish = false

[[bin]]
name = "work"
path = "src/main.rs"

[dependencies]
aria-json-telemetry = { workspace = true, features = ["cli"] }

[lints]
workspace = true
