name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # The Python extension needs a linker that defers CPython symbols; that
      # is configured per-target in .cargo/config.toml, so it builds here too.
      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (G1)
        run: cargo test --workspace

      - name: 1000-step OPMD run (G5)
        run: cargo run --release -p aria-engine -- run --steps 1000 --schedule opmd --output trace.jsonl

      - name: Action alphabet lock (G2)
        shell: bash
        run: ./scripts/check_action_alphabet.sh

  wasm:
    name: WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-bindgen-action@v0.2.0
        with:
          version: latest

      - name: Build wasm32 target and JS bindings
        run: ./scripts/build_wasm.sh

      - name: Parity — WASM runs the same OPMD schedule as the CLI (Exit2)
        run: |
          cargo build --release -p aria-engine
          node www/parity.mjs

  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2

      - name: Install maturin and pytest
        run: pip install maturin pytest

      - name: Build the CLI (needed by the differential parity test)
        run: cargo build -p aria-engine

      - name: Build and install the extension
        run: maturin develop --manifest-path python/aria-py/Cargo.toml

      - name: Python tests (G1)
        run: pytest python/tests -q

  tla:
    name: TLA+ regression (G6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Skip unless spec/ changed
        id: changed
        run: |
          if git diff --quiet origin/main...HEAD -- spec/; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "TLA untouched — skipping TLC."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run TLC on AriaInstance
        if: steps.changed.outputs.run == 'true'
        run: |
          curl -sSL -o tla2tools.jar https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar
          cd spec
          java -XX:+UseParallelGC -cp ../tla2tools.jar tlc2.TLC -config AriaInstance.cfg AriaInstance
